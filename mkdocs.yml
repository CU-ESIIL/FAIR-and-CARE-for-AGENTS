site_name: "FAIR + CARE for Agentic Science"
site_description: "Using agentic AI as a stress test for explicit, reproducible, and governable science"
site_url: "https://cu-esiil.github.io/FAIR-and-CARE-for-AGENTS/"

repo_name: "CU-ESIIL/FAIR-and-CARE-for-AGENTS"
repo_url: "https://github.com/CU-ESIIL/FAIR-and-CARE-for-AGENTS"
edit_uri: "edit/main/docs/"

nav:
  - Project:
      - Home: index.md
  - Evidence maps:
      - Overview: principles/index.md
      - "FAIR — Findable": principles/fair-findable.md
      - "FAIR — Accessible": principles/fair-accessible.md
      - "FAIR — Interoperable": principles/fair-interoperable.md
      - "FAIR — Reusable": principles/fair-reusable.md
      - "CARE — Collective Benefit": principles/care-collective-benefit.md
      - "CARE — Authority to Control": principles/care-authority-to-control.md
      - "CARE — Responsibility": principles/care-responsibility.md
      - "CARE — Ethics": principles/care-ethics.md

theme:
  name: material
  logo: assets/brand/oasis-wordmark.png
  favicon: assets/esiil_content/favicon.ico
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search
